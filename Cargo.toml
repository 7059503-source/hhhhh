[workspace]
resolver = "2"
members = [
    "backend",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Developer"]

[workspace.dependencies]
leptos = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
jsonwebtoken = "9.3"
bcrypt = "0.16"
dirs = "5.0"
chrono = "0.4"

[profile.release]
opt-level = 's'
